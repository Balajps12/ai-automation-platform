<!DOCTYPE html>
<html>

<head>

  <title>AI Command Center</title>

  <style>

    body {
      background: #111;
      color: white;
      font-family: Arial;
      padding: 30px;
    }

    h1 {
      color: #00ff99;
    }

    .stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .card {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      min-width: 220px;
    }

    .section {
      margin-top: 40px;
    }

    pre {
      white-space: pre-wrap;
      background: #1a1a1a;
      padding: 15px;
      border-radius: 10px;
    }

  </style>

</head>

<body>

  <h1>🚀 AI Operations Command Center</h1>

  <div class="stats" id="stats"></div>

  <div class="section">

    <h2>📈 Optimized Campaigns</h2>

    <div id="campaigns"></div>

  </div>

  <div class="section">

    <h2>📊 Performance Analytics</h2>

    <div id="analytics"></div>

  </div>

  <script>

    async function loadDashboard() {

      const response =
        await fetch(
          "http://localhost:5000/api/command-center"
        );

      const data =
        await response.json();

      // STATS

      const stats =
        document.getElementById("stats");

      stats.innerHTML = `

        <div class="card">
          <h3>Total Leads</h3>
          <p>${data.crm.totalLeads}</p>
        </div>

        <div class="card">
          <h3>High Priority Leads</h3>
          <p>${data.crm.highPriority}</p>
        </div>

        <div class="card">
          <h3>Follow-Ups Generated</h3>
          <p>${data.crm.followUpsGenerated}</p>
        </div>

        <div class="card">
          <h3>AI Agents Active</h3>
          <p>${data.system.aiAgentsActive}</p>
        </div>

        <div class="card">
          <h3>Workflows Running</h3>
          <p>${data.system.workflowsRunning}</p>
        </div>

        <div class="card">
          <h3>System Health</h3>
          <p>${data.system.systemHealth}</p>
        </div>
      `;

      // CAMPAIGNS

      const campaigns =
        document.getElementById(
          "campaigns"
        );

      data.campaigns.forEach(item => {

        const div =
          document.createElement("div");

        div.className = "card";

        div.innerHTML = `
          <h3>${item.file}</h3>
          <pre>${item.content}</pre>
        `;

        campaigns.appendChild(div);
      });

      // ANALYTICS

      const analytics =
        document.getElementById(
          "analytics"
        );

      data.analytics.forEach(item => {

        const div =
          document.createElement("div");

        div.className = "card";

        div.innerHTML = `
          <h3>${item.file}</h3>
          <pre>${item.content}</pre>
        `;

        analytics.appendChild(div);
      });
    }

    loadDashboard();

  </script>

</body>

</html>
